<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Headroom: will this LLM fit on my GPU? Weights, KV cache per token and per request, max concurrent users, max context, and a decode-speed estimate from a Hugging Face repo id."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Headroom</title>
    <script>
      // Set the theme before first paint so there is no flash; the app takes over after load.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('headroom.theme');
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          try {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (e) {
            t = 'dark';
          }
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
